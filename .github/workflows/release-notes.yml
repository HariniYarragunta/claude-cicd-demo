# On every tag push matching v*, asks Claude to summarize the commits since
# the previous tag into user-facing release notes, then publishes a GitHub
# Release with them. Requires the ANTHROPIC_API_KEY secret.
name: Release Notes

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine previous tag
        id: prev_tag
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
          echo "current_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Write user-facing release notes for tag ${{ steps.prev_tag.outputs.current_tag }}.
            Inspect the commits with:
              git log ${{ steps.prev_tag.outputs.prev_tag && format('{0}..HEAD', steps.prev_tag.outputs.prev_tag) || 'HEAD' }} --oneline
            Group the changes under "Features", "Fixes", and "Other" headings
            (omit empty groups). Keep it concise and skip merge commits.
          claude_args: |
            --allowedTools "Bash(git log:*),Bash(git show:*),Read"
            --json-schema {"type":"object","properties":{"title":{"type":"string"},"body_markdown":{"type":"string"}},"required":["title","body_markdown"]}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: ${{ steps.notes.outputs.structured_output }}
          TAG: ${{ steps.prev_tag.outputs.current_tag }}
        run: |
          echo "$OUTPUT" | jq -r '.body_markdown' > release-notes.md
          TITLE=$(echo "$OUTPUT" | jq -r '.title')
          gh release create "$TAG" --title "$TITLE" --notes-file release-notes.md
