# Runs the test suite; on failure, asks Groq (via its OpenAI-compatible chat
# completions API) to read the failure log and the changed source files to
# produce a root-cause analysis, then posts it as a PR comment (or, for
# pushes with no PR, opens an issue). Requires the GROQ_API_KEY secret.
name: Test Failure Analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.run_tests.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        id: run_tests
        run: npm test > test-output.log 2>&1
        continue-on-error: true

      - name: Upload test log
        if: steps.run_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-output-log
          path: test-output.log

      - name: Build analysis context
        if: steps.run_tests.outcome == 'failure'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)
          fi

          {
            echo "=== test-output.log ==="
            cat test-output.log
            for f in $CHANGED_FILES; do
              if [ -f "$f" ]; then
                echo
                echo "=== $f ==="
                cat "$f"
              fi
            done
          } | head -c 100000 > context.txt

          printf '%s\n' \
            'You are a CI assistant analyzing a failing test suite. You are given the test failure log and the full content of every file changed in this commit or pull request.' \
            'Respond with ONLY a JSON object of the exact shape {"root_cause": string, "suggested_fix": string}. No markdown fences, no extra commentary.' \
            > system-prompt.txt

      - name: Analyze failure with Groq
        if: steps.run_tests.outcome == 'failure'
        id: analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          OUTPUT=$(bash .github/scripts/groq-chat.sh --system-file system-prompt.txt --user-file context.txt --json)
          echo "structured_output<<GROQ_EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "GROQ_EOF" >> "$GITHUB_OUTPUT"

      - name: Post analysis to PR
        if: steps.run_tests.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: ${{ steps.analysis.outputs.structured_output }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### 🔴 Test failure — automated root-cause analysis"
            echo
            echo "**Root cause:**"
            echo "$OUTPUT" | jq -r '.root_cause'
            echo
            echo "**Suggested fix:**"
            echo "$OUTPUT" | jq -r '.suggested_fix'
          } > analysis-comment.md
          gh pr comment "$PR_NUMBER" --body-file analysis-comment.md

      - name: File issue for failure on main
        if: steps.run_tests.outcome == 'failure' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: ${{ steps.analysis.outputs.structured_output }}
        run: |
          {
            echo "**Root cause:**"
            echo "$OUTPUT" | jq -r '.root_cause'
            echo
            echo "**Suggested fix:**"
            echo "$OUTPUT" | jq -r '.suggested_fix'
            echo
            echo "Commit: ${{ github.sha }}"
          } > analysis-comment.md
          gh issue create --title "Tests failing on main ($(git rev-parse --short HEAD))" \
            --body-file analysis-comment.md --label test-failure

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
